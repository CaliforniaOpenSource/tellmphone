[project]
name = "tellmphone"
version = "0.1.0"
description = "Let your LLMs call each other — a local MCP switchboard for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Dewald", email = "kevin@californiaopensource.com" }]
keywords = ["mcp", "llm", "agents", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/CaliforniaOpenSource/tellmphone"
Repository = "https://github.com/CaliforniaOpenSource/tellmphone"
Issues = "https://github.com/CaliforniaOpenSource/tellmphone/issues"

[project.scripts]
tellmphone = "tellmphone.cli:main"

[project.entry-points."tellmphone.adapters"]
claude = "tellmphone.adapters.claude:ClaudeAdapter"
codex = "tellmphone.adapters.codex:CodexAdapter"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tellmphone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
